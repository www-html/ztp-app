# ZTP file server and dynamic Auto Pool resolver.
# Installed only by deploy/install.sh; DHCP deploy never reloads Nginx.
log_format ztp '$remote_addr [$time_iso8601] "$request" $status $body_bytes_sent $request_time "$request_id" "$upstream_http_x_ztp_config_filename" "$upstream_http_x_ztp_config_checksum" "$upstream_http_x_ztp_assignment_type" "$upstream_http_x_ztp_expected_bytes" "$http_user_agent"';
access_log /var/log/nginx/ztp-access.log ztp;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    root /var/www/html;

    location = /ztp/config {
        proxy_pass http://127.0.0.1:8080/ztp/config;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    location /configs/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
