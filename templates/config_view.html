<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ filename }} · ZTP Manager</title>
<style>
:root{--nav:#102a43;--bg:#f5f7fa;--card:#fff;--line:#d8e0ea;--muted:#667085;--text:#172b4d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,Segoe UI,Arial,sans-serif}.wrap{max-width:1400px;margin:auto;padding:26px}.head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}.eyebrow{margin:0;color:#185abd;font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}h1{margin:3px 0;font-size:24px;color:var(--nav);overflow-wrap:anywhere}.muted{color:var(--muted);font-size:12px}.btn{display:inline-block;padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--text);text-decoration:none;font-size:12px}.panel{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;box-shadow:0 2px 8px #102a4312}.code{margin:0;max-height:calc(100vh - 170px);overflow:auto;padding:18px;background:#101828;color:#d1e4ff;border-radius:6px;font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere}
</style>
</head>
<body><main class="wrap"><div class="head"><div><p class="eyebrow">Workspace / Config file</p><h1>{{ filename }}</h1><p class="muted">Read-only view · {{ size }} bytes</p></div><a class="btn" href="/?view=configs">Back to Config Files</a></div><section class="panel"><pre class="code">{{ content }}</pre></section><p class="muted">ztp-app {{ version }} · Download remains available at <code>/configs/{{ filename }}</code> for ZTP devices.</p></main></body>
</html>
