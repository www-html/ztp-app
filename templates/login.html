<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in · ZTP Manager</title>
<style>
:root{--nav:#102a43;--blue:#185abd;--bg:#f5f7fa;--line:#d8e0ea;--text:#172b4d;--muted:#667085;--bad:#b42318}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:14px/1.45 Inter,Segoe UI,Arial,sans-serif}.card{width:min(400px,calc(100% - 32px));padding:30px;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 36px #102a4318}.brand{color:var(--nav);font-size:20px;font-weight:750}.brand small{display:block;margin-top:2px;color:var(--muted);font-size:11px;font-weight:500;letter-spacing:.08em}.intro{margin:24px 0 18px}.intro h1{margin:0;color:var(--nav);font-size:23px}.intro p{margin:5px 0 0;color:var(--muted);font-size:12px}label{display:block;margin-top:12px;color:#475467;font-size:12px}input{width:100%;margin-top:5px;padding:10px 11px;border:1px solid #b9c4d0;border-radius:6px;font:inherit}input:focus{outline:2px solid #bfd7ff;border-color:var(--blue)}button{width:100%;margin-top:20px;padding:10px;border:0;border-radius:6px;background:var(--blue);color:#fff;font:inherit;font-weight:650;cursor:pointer}.error{margin:0 0 12px;padding:9px 10px;border-radius:6px;background:#fdeceb;color:var(--bad);font-size:12px}.foot{margin-top:20px;color:#98a2b3;text-align:center;font-size:11px}
</style>
</head>
<body><main class="card"><div class="brand">ZTP Manager<small>OPERATIONS CONSOLE</small></div><div class="intro"><h1>Sign in</h1><p>Use your ZTP Manager administrator account.</p></div>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post" action="/login"><input type="hidden" name="next" value="{{ next_url }}"><label>Username<input name="username" autocomplete="username" required autofocus></label><label>Password<input type="password" name="password" autocomplete="current-password" required></label><button type="submit">Sign in</button></form><div class="foot">ztp-app {{ version }}</div></main></body>
</html>
